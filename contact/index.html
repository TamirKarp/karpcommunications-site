<body>
<header class="site-header">
  <a class="brand" href="/">karpcommunications.com</a>
  <nav aria-label="Main"><a href="/schools/">Schools</a><a href="/clearsite/">ClearSite</a><a href="/creatives/">Creatives</a><a href="/contact/" aria-current="page">Contact</a><a href="https://calendly.com/karpcommunications-info/30min" target="_blank" rel="noopener">Book a meeting</a></nav>
</header>
<main>
<section class="kc-formwrap" id="contact">
  <div class="kc-formwrap-inner">
    <h1 class="kc-form-h">Get in touch with your request</h1>
    <p class="kc-form-sub">Just add the details below</p>
    <form class="kc-form" method="POST" action="https://karpcommunications-forms.karpcomms.workers.dev/" data-kc-form novalidate>
      <label for="contact-name">Name</label>
      <input id="contact-name" name="name" type="text" autocomplete="name">
      <label for="contact-email">Email<span aria-hidden="true">*</span></label>
      <input id="contact-email" name="email" type="email" autocomplete="email" required>
      <label for="contact-message">Message<span aria-hidden="true">*</span></label>
      <textarea id="contact-message" name="message" rows="6" required></textarea>
      <input type="hidden" name="source" value="contact">
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="kc-hp" aria-hidden="true">
      <button type="submit">Send</button>
      <p class="kc-form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
</main>
